version: '3.9'

services:
  # PostgreSQL + pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: finance-agent-db
    environment:
      POSTGRES_DB: finance_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - finance-agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d finance_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: finance-agent-cache
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - finance-agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant 벡터 DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-agent-vectordb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    networks:
      - finance-agent-network

  # Vault (시크릿 관리)
  vault:
    image: hashicorp/vault:latest
    container_name: finance-agent-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    networks:
      - finance-agent-network
    command: server -dev

  # Prometheus (메트릭)
  prometheus:
    image: prom/prometheus:latest
    container_name: finance-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - finance-agent-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana (시각화)
  grafana:
    image: grafana/grafana:latest
    container_name: finance-agent-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - finance-agent-network
    depends_on:
      - prometheus

  # Agent API 서비스
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - finance-agent-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      vault:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  vault_data:
  vault_logs:
  prometheus_data:
  grafana_data:

networks:
  finance-agent-network:
    driver: bridge
